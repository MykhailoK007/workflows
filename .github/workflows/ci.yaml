name: ci
on:
  pull_request:
    branches: [main]
env:
  Name: 'Job'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node
      uses: actions/setup-node@v7
    - name: Install dependency
      run: npm ci
    - run: echo {env.Name}
    - run: npm run lint
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node
      uses: actions/setup-node@v7
    - name: Install dependency
      run: npm ci
    - name: Create build
      run: npm run build




